<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SparkView Dashboard</title>
  <link rel="stylesheet" href="/style.css?v=__JS_VERSION__">
</head>
<body>
  <header id="header">
    <div class="header-left">
      <span id="logo" class="logo">SPARK<span class="logo-accent">VIEW</span></span>
      <span id="node-count" class="header-info"></span>
    </div>
    <div class="header-right">
      <select id="theme-pick" class="theme-pick" title="Theme" aria-label="Theme">
        <option value="classic">Classic</option>
        <option value="refined">Refined</option>
        <option value="quiet">Quiet</option>
        <option value="terminal">Terminal</option>
        <option value="light">Light</option>
        <option value="wall">Wall</option>
      </select>
      <span id="conn-status" class="conn-dot connected" title="Connected"></span>
    </div>
  </header>

  <!-- Nodes and their cards are built by dashboard.js from /api/board -->
  <main id="board" class="board columns"></main>

  <footer id="footer">
    <span id="last-refresh"></span>
    <span id="footer-note" class="footer-secondary"></span>
  </footer>

  <script src="/dashboard.js?v=__JS_VERSION__"></script>
</body>
</html>
